<template>
  <c-cares-geofence-card view={view} audience="admin">
    <template lwc:if={needsOrderInput}>
      <div class="search">
        <lightning-input
          label="Order number"
          placeholder="PR-240101-ABC1234"
          value={orderInput}
          onchange={handleOrderInput}
        ></lightning-input>
        <lightning-button
          label="Show geofence"
          onclick={handleSearch}
          disabled={loading}
        ></lightning-button>
      </div>
    </template>
    <template lwc:if={error}>
      <p class="message">
        The geofence could not be loaded. Check that you have the CARES Delivery
        Mock Admin permission set.
      </p>
    </template>
    <template lwc:if={notFound}>
      <p class="message">No delivery telemetry for this order.</p>
    </template>
  </c-cares-geofence-card>
</template>
